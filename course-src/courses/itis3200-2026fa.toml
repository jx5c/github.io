# Grading components  (weight is a %, extra=true renders as extra credit)
[[weight]]
label = "Homework (35%)"
text  = "assigned approximately weekly via Canvas. Each assignment has two parts: hands-on exercises and scenario-based analysis questions."
[[weight]]
label = "Midterm exam (20%)"
text  = "in class; Mon, Sep 28; 10:00-11:15am. Covers the cryptography lectures."
[[weight]]
label = "Final exam (25%)"
text  = "in class; Wed, Dec 9; 8:00-10:30am (University final-exam schedule)."
[[weight]]
label = "Course project (10%)"
text  = "group project (maximum four students). Includes design, implementation, and evaluation, with a proposal, a final report, code on GitHub, and a 10-minute presentation."
[[weight]]
label = "In-class quizzes (10%)"
text  = "short quizzes at the start of most lectures (4-5 single- or multiple-choice questions on the previous lecture). No late submissions; the lowest two scores are dropped."
[[weight]]
label = "Engagement and interaction (extra credit, capped at 3%)"
text  = "meaningful academic engagement such as in-class Q&amp;A and attending office hours."

