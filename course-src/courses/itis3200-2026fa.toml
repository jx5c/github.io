description   = "An introduction to fundamental concepts of security. Common topics include: security concepts and mechanisms; security technologies; mandatory and discretionary controls; basic cryptography and its applications; web security; network security; and system security. The course includes programming assignments and projects through which students learn how to use and implement security mechanisms."

