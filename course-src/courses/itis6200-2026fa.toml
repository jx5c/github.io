# =============================================================================
#  WEEKLY READING (drives schedule.html reading column, papers.html, and the
#  Canvas paper-reading page). One [[week]] per lecture week.
#    section       = topic-heading band on the schedule (optional)
#    no_reading    = exam / presentation week
#    both_required = both papers required of everyone (marked BOTH REQUIRED)
#    two_groups    = two groups lead that week
#    glance_req    = short "required of everyone" text for the at-a-glance table
#    q             = three discussion questions (last is the bridge question)
#  [[week.paper]] role = Required | Recommended | Reference
# =============================================================================

[[week]]
n = 1
section = "Introduction"
date = "Tue 18-Aug"
date_long = "Tue 18 Aug"
topic = "Introduction to Security &amp; Cryptography"
led_in_class = true
glance_req = "Saltzer &amp; Schroeder, Section I"
glance_note = "led in class"
glance_pages = "8"
q = [
  "Pick one system you use daily. Which of the eight principles does it violate, and was that a mistake or a deliberate trade?",
  "The principles have never been meaningfully revised in fifty years. Is that because they are right, or because nobody has tried?",
  "Herley &amp; van Oorschot ask what a falsifiable security claim would look like. Take one Saltzer principle &mdash; can it be tested, or is it only a heuristic?",
]
[[week.paper]]
role = "Required"
title = "The Protection of Information in Computer Systems"
short = "Saltzer &amp; Schroeder, <em>Protection of Information in Computer Systems</em>"
url = "https://web.mit.edu/Saltzer/www/publications/protection/"
cite = "Saltzer &amp; Schroeder &middot; Proceedings of the IEEE, 1975 &middot; Section I only, ~8 pp of 31"
pages = "8"
pages_note = "Section I only"
diff = "EASY"
blurb = "The eight design principles &mdash; least privilege, fail-safe defaults, economy of mechanism, open design. Still the vocabulary every security argument is conducted in. <strong>Read Section I only.</strong>"
background = "None. This is the one reading in the course with no prerequisites at all."
[[week.paper]]
role = "Recommended"
title = "SoK: Science, Security, and the Elusive Goal of Security as a Scientific Pursuit"
url = "https://www.microsoft.com/en-us/research/wp-content/uploads/2017/03/scienceAndSecuritySoK.pdf"
cite = "Herley &amp; van Oorschot &middot; IEEE S&amp;P, 2017 &middot; 22 pp"
diff = "MODERATE"
blurb = "Argues much security work fails basic scientific standards. It licenses you to be skeptical of every paper assigned after it."
background = "General research literacy. No technical prerequisites."

[[week]]
n = 2
section = "Cryptography"
date = "Tue 25-Aug"
date_long = "Tue 25 Aug"
topic = "One-time Pad &amp; Block Cipher"
glance_req = "Mason et al. (two-time pad)"
glance_pages = "10"
q = [
  "The one-time pad is provably unbreakable, and this paper breaks it. Precisely which assumption of the proof failed?",
  "The attack works because English is redundant. What would you have to encrypt for a two-time pad to stay safe &mdash; and is that ever realistic?",
  "Shannon proves the one-time pad is perfectly secret. Given a proof that strong, why does essentially nobody use it? Name the engineering property that kills it.",
]
[[week.paper]]
role = "Required"
title = "A Natural Language Approach to Automated Cryptanalysis of Two-Time Pads"
short = "Mason et al., <em>Automated Cryptanalysis of Two-Time Pads</em>"
url = "https://www.cs.jhu.edu/~jason/papers/mason+al.ccs06.pdf"
cite = "Mason, Watkins, Muth, Eisner &amp; Stubblefield &middot; ACM CCS, 2006 &middot; 10 pp"
pages = "10"
diff = "MODERATE"
blurb = "What actually happens when a one-time pad gets used twice: the redundancy of English is enough to pull both plaintexts back out, automatically. The concrete counterweight to the perfect-secrecy proof."
background = "XOR and the definition of a one-time pad, both from this week's lecture, plus basic probability. <strong>No networking, no protocols.</strong>"
[[week.paper]]
role = "Recommended"
title = "Communication Theory of Secrecy Systems"
url = "https://www.cs.virginia.edu/~evans/greatworks/shannon1949.pdf"
cite = "Claude Shannon &middot; Bell System Technical Journal, 1949 &middot; Sections 1&ndash;10, ~15 pp of 60"
diff = "HARD"
blurb = "Where perfect secrecy is defined and the one-time pad proved optimal. Genuinely hard; if you read it, the goal is to see <em>why</em> the key must be as long as the message."
background = "Comfort with probability and formal definitions."

[[week]]
n = 3
section = "Cryptography"
date = "Tue 1-Sep"
date_long = "Tue 1 Sep"
topic = "Block Cipher &amp; Cryptographic Hashes"
glance_req = "Leurent &amp; Peyrin (SHA-1)"
glance_pages = "18"
q = [
  "Distinguish collision resistance from second-preimage resistance. For which real systems does a plain collision matter, and for which is it harmless?",
  "The attack costs about $45K. How should a standards body use a number like that &mdash; what is the right safety margin, and in what units?",
  "MD5 fell in 2005 and was still in production a decade later; SHA-1 repeated the pattern. Whose job is deprecation, and why is that job structurally so hard?",
]
[[week.paper]]
role = "Required"
title = "SHA-1 is a Shambles: First Chosen-Prefix Collision on SHA-1 and Application to the PGP Web of Trust"
short = "Leurent &amp; Peyrin, <em>SHA-1 is a Shambles</em>"
url = "https://www.usenix.org/system/files/sec20-leurent.pdf"
cite = "Leurent &amp; Peyrin &middot; USENIX Security, 2020 &middot; 18 pp"
pages = "18"
diff = "MODERATE"
blurb = "A forged identity certificate for about $45K of GPU time. It turns collision resistance from a math property into a budget line."
background = "What a hash function is and what a collision is, both from this week's lecture. Skim the differential-path sections."
[[week.paper]]
role = "Recommended"
title = "How to Break MD5 and Other Hash Functions"
url = "https://iacr.org/archive/eurocrypt2005/34940019/34940019.pdf"
cite = "Wang &amp; Yu &middot; EUROCRYPT, 2005 &middot; 17 pp"
diff = "HARD"
blurb = "The paper that ended MD5. Read it for the result and the differential-path idea. <strong>Nobody is expected to verify the differentials.</strong>"
background = "Hash construction internals and comfort reading bit-level notation."

[[week]]
n = 4
section = "Cryptography"
date = "Tue 8-Sep"
date_long = "Tue 8 Sep"
topic = "MAC &amp; Authenticated Encryption"
glance_req = "Vaudenay, Sections 1&ndash;4, 6&ndash;7"
glance_note = "lightest"
glance_pages = "7"
q = [
  "The attacker learns one bit &mdash; whether padding was valid &mdash; and recovers the entire plaintext. How is that possible from one bit?",
  "Encrypt-then-MAC, MAC-then-Encrypt, Encrypt-and-MAC. Which composition does this attack require, and would it survive under the others?",
  "WinZip encrypted its data and checksummed it. Name precisely what a checksum fails to provide that a MAC provides.",
]
[[week.paper]]
role = "Required"
title = "Security Flaws Induced by CBC Padding"
short = "Vaudenay, <em>Security Flaws Induced by CBC Padding</em>"
url = "https://www.iacr.org/archive/eurocrypt2002/23320530/cbc02_e02d.pdf"
cite = "Serge Vaudenay &middot; EUROCRYPT, 2002 &middot; Sections 1&ndash;4 and 6&ndash;7, ~7 pp of 8"
pages = "7"
pages_note = "Sections 1&ndash;4, 6&ndash;7"
diff = "MODERATE"
blurb = "The padding-oracle attack, built from first principles. The cleanest possible demonstration of why encryption without integrity is not enough. <strong>Section 5 maps the attack onto specific protocols &mdash; skip it.</strong>"
background = "CBC mode, padding, XOR, and what a MAC is &mdash; all from Weeks 3&ndash;4."
[[week.paper]]
role = "Recommended"
title = "Attacking and Repairing the WinZip Encryption Scheme"
url = "https://cryptosec.ucsd.edu/miscpapers/winzip-ccs04.pdf"
cite = "Tadayoshi Kohno &middot; ACM CCS, 2004 &middot; 10 pp"
diff = "MODERATE"
blurb = "A concrete, entirely symmetric-crypto example of the same lesson: WinZip encrypted and checksummed, which is not the same as authenticating."
background = "AES-CTR, HMAC, and CRC checksums. No networking or public-key crypto."
[[week.paper]]
role = "Reference"
title = "Lucky Thirteen: Breaking the TLS and DTLS Record Protocols"
url = "https://www.isg.rhul.ac.uk/tls/TLStiming.pdf"
cite = "AlFardan &amp; Paterson &middot; IEEE S&amp;P, 2013 &middot; 16 pp"
blurb = "Optional, and best read late in the term. This is Vaudenay's attack carried into TLS via microsecond timing &mdash; it will make much more sense after Week 11."
background = "Requires the TLS record protocol and network timing, neither of which is covered yet."

[[week]]
n = 5
section = "Cryptography"
date = "Tue 15-Sep"
date_long = "Tue 15 Sep"
topic = "PRNG &amp; Diffie-Hellman Exchange"
glance_req = "Heninger et al. (Ps and Qs)"
glance_pages = "16"
q = [
  "These devices ran correct, well-tested key-generation code. Where exactly did security get lost, and which layer of the stack owned that failure?",
  "The work depends on scanning the entire internet. What ethical constraints should govern that kind of research, and did these authors meet them?",
  "Logjam works because everyone reuses the same parameters. Standardization is normally good practice &mdash; when does it become a liability?",
]
[[week.paper]]
role = "Required"
title = "Mining Your Ps and Qs: Detection of Widespread Weak Keys in Network Devices"
short = "Heninger et al., <em>Mining Your Ps and Qs</em>"
url = "https://factorable.net/weakkeys12.extended.pdf"
cite = "Heninger, Durumeric, Wustrow &amp; Halderman &middot; USENIX Security, 2012 &middot; 16 pp"
pages = "16"
diff = "EASY"
blurb = "Scanned the entire internet and factored real devices' keys, because embedded systems generated them before they had any entropy. The best argument ever made for taking random-number generation seriously."
background = "Randomness and entropy from this week's lecture, plus one fact from Week 6 the instructor will state first: an RSA public key is the product of two large secret primes, so if two keys share a prime a GCD recovers both."
[[week.paper]]
role = "Recommended"
title = "Imperfect Forward Secrecy: How Diffie-Hellman Fails in Practice"
url = "https://weakdh.org/imperfect-forward-secrecy-ccs15.pdf"
cite = "Adrian et al. &middot; ACM CCS, 2015 &middot; 13 pp (Logjam)"
diff = "MODERATE"
blurb = "A handful of hardcoded primes protect most of the internet &mdash; precompute against one, break millions of connections."
background = "Diffie-Hellman from this week; the precomputation argument stands on its own."

[[week]]
n = 6
section = "Cryptography"
date = "Tue 22-Sep"
date_long = "Tue 22 Sep"
topic = "Public-Key Encryption &amp; Digital Signatures &amp; Certificates"
glance_req = "Rivest, Shamir &amp; Adleman"
glance_pages = "15"
q = [
  "RSA assumes you already know the recipient's true public key. Where does that assumption get discharged in practice, and what does it cost?",
  "The paper is seven pages and launched a fifty-year industry. What made it so compact &mdash; and could a result like this be published that briefly today?",
  "Threema used sound primitives and still failed seven ways. What does that say about where security effort should actually be concentrated?",
]
[[week.paper]]
role = "Required"
title = "A Method for Obtaining Digital Signatures and Public-Key Cryptosystems"
short = "Rivest, Shamir &amp; Adleman, <em>A Method for Obtaining Digital Signatures</em>"
url = "https://people.csail.mit.edu/rivest/Rsapaper.pdf"
cite = "Rivest, Shamir &amp; Adleman &middot; CACM, 1978 &middot; 15 pp (single-column reprint; the printed CACM version is 7)"
pages = "15"
diff = "EASY"
blurb = "Covers both halves of the week &mdash; encryption and signatures &mdash; in prose you can follow start to finish."
background = "Modular arithmetic and prime factorization. Entirely self-contained."
[[week.paper]]
role = "Recommended"
title = "Three Lessons from Threema: Analysis of a Secure Messenger"
url = "https://www.usenix.org/system/files/usenixsecurity23-paterson.pdf"
cite = "Paterson, Scarlata &amp; Truong &middot; USENIX Security, 2023 &middot; 18 pp"
diff = "MODERATE"
blurb = "Seven attacks on a shipping &ldquo;secure&rdquo; messenger, nearly all from misusing sound primitives rather than breaking them."
background = "Public-key encryption, signatures and key exchange."
[[week.paper]]
role = "Reference"
title = "Bamboozling Certificate Authorities with BGP"
url = "https://www.usenix.org/system/files/conference/usenixsecurity18/sec18-birge-lee.pdf"
cite = "Birge-Lee, Sun, Edmundson, Rexford &amp; Mittal &middot; USENIX Security, 2018 &middot; 16 pp"
blurb = "Optional now, much better after Week 11: hijack a route, pass domain validation, get a real certificate for a domain you do not own."
background = "Requires BGP and internet routing, which arrive in Week 11."

[[week]]
n = 7
section = "Midterm"
date = "Tue 29-Sep"
date_long = "Tue 29 Sep"
topic = "<strong>MID-TERM EXAM</strong> (Covers lectures on Cryptography)"
no_reading = true

[[week]]
n = 8
section = "Access Control"
date = "Tue 6-Oct"
date_long = "Tue 6 Oct"
topic = "Access Control"
both_required = true
glance_req = "Sandhu <strong>+</strong> Reardon"
glance_note = "BOTH"
glance_pages = "30"
why_both = "30 pages, but both are easy reads, and the contrast <em>is</em> the concept. A clean model versus a leaking enforcement boundary is the entire lesson of access control."
q = [
  "Sandhu's model assumes the reference monitor sees every access. Which circumvention techniques in Reardon et al. violate that &mdash; and is it a model failure or an implementation failure?",
  "RBAC is thirty years old and still dominant. Is that because it is right, or because migration costs make anything else infeasible?",
  "Reardon et al. found thousands of misbehaving apps at once and disclosed to Google. What obligations does a measurement paper carry at that scale?",
]
[[week.paper]]
role = "Required"
title = "Role-Based Access Control Models"
short = "Sandhu et al., <em>Role-Based Access Control Models</em>"
url = "https://csrc.nist.gov/csrc/media/projects/role-based-access-control/documents/sandhu96.pdf"
cite = "Sandhu, Coyne, Feinstein &amp; Youman &middot; IEEE Computer, 1996 &middot; 10 pp"
pages = "10"
diff = "EASY"
blurb = "The RBAC reference model every enterprise identity system is still a variation on. Clean diagrams, no formal background required."
background = "None beyond this week's lecture."
[[week.paper]]
role = "Required"
title = "50 Ways to Leak Your Data: An Exploration of Apps' Circumvention of the Android Permissions System"
short = "Reardon et al., <em>50 Ways to Leak Your Data</em>"
url = "https://www.usenix.org/system/files/sec19-reardon.pdf"
cite = "Reardon, Feal, Wijesekera, Elazari Bar On, Vallina-Rodriguez &amp; Egelman &middot; USENIX Security, 2019 &middot; 20 pp"
pages = "20"
diff = "EASY"
blurb = "Real app-store apps systematically routing around a well-designed permission model via side and covert channels."
background = "Basic familiarity with how mobile apps request permissions."

[[week]]
n = 9
section = "Web Security"
date = "Tue 13-Oct"
date_long = "Tue 13 Oct"
topic = "Intro to Web and Cookies"
glance_req = "Singh et al. (browser access control)"
glance_pages = "16"
q = [
  "The browser has to isolate mutually distrusting sites in one process, with no installer and no administrator. Which of Week 8's access-control assumptions survive that setting?",
  "The paper finds browser policies that contradict each other. Why would a policy end up incoherent over twenty years?",
  "If the browser is an access-control system, what is the principal, what is the resource, and who is the reference monitor? Where does the analogy break?",
]
[[week.paper]]
role = "Required"
title = "On the Incoherencies in Web Browser Access Control Policies"
short = "Singh et al., <em>Incoherencies in Web Browser Access Control Policies</em>"
url = "https://www.microsoft.com/en-us/research/wp-content/uploads/2016/12/incoherencyAndWebAnalyzer.pdf"
cite = "Singh, Moshchuk, Wang &amp; Lee &middot; IEEE S&amp;P, 2010 &middot; 16 pp"
pages = "16"
diff = "MODERATE"
blurb = "Treats the browser as an access-control system &mdash; principals, resources, policies &mdash; and shows its own policies disagree with each other."
background = "The same-origin policy and cookies, both from <em>this week's lecture</em>. It also needs Week 8's access-control ideas and knowing what a URL and JavaScript are."
[[week.paper]]
role = "Recommended"
title = "Securing Frame Communication in Browsers"
url = "https://www.usenix.org/legacy/event/sec08/tech/full_papers/barth/barth.pdf"
cite = "Barth, Jackson &amp; Mitchell &middot; USENIX Security, 2008 &middot; 14 pp"
diff = "MODERATE"
blurb = "How frame navigation broke isolation between sites. This work directly shaped the HTML5 postMessage design."
background = "Assumes the same-origin policy is already understood &mdash; read it after the required paper."

[[week]]
n = 10
section = "Web Security"
date = "Tue 20-Oct"
date_long = "Tue 20 Oct"
topic = "CSRF, XSS, SQL injection"
both_required = true
two_groups = true
glance_req = "Barth <strong>+</strong> Steffens"
glance_note = "BOTH"
glance_pages = "27"
why_both = "the week's real question is why SQL injection got solved and XSS did not. That comparison needs all three attack classes in the room at once."
q = [
  "SQL injection is largely solved by parameterized queries; XSS has no analogous single fix. What structural difference between the two explains that?",
  "Steffens et al. find defenses sitting server-side while the vulnerability moved client-side. What other defenses in this course are guarding the wrong place?",
  "CSRF defenses became framework defaults; content-security policies require per-site configuration and are widely misconfigured. What does that predict about which mitigations work at scale?",
]
[[week.paper]]
role = "Required"
title = "Robust Defenses for Cross-Site Request Forgery"
short = "Barth et al., <em>Robust Defenses for Cross-Site Request Forgery</em>"
url = "https://seclab.stanford.edu/websec/csrf/csrf.pdf"
cite = "Barth, Jackson &amp; Mitchell &middot; ACM CCS, 2008 &middot; 12 pp"
pages = "12"
diff = "EASY"
blurb = "Introduces login-CSRF and the Origin header. The reason every web framework ships CSRF tokens by default."
background = "Cookies and the same-origin policy from Week 9."
[[week.paper]]
role = "Required"
title = "Don't Trust The Locals: Investigating the Prevalence of Persistent Client-Side Cross-Site Scripting in the Wild"
short = "Steffens et al., <em>Don't Trust The Locals</em>"
url = "https://www.ndss-symposium.org/wp-content/uploads/2019/02/ndss2019_01B-1_Steffens_paper.pdf"
cite = "Steffens, Rossow, Johns &amp; Stock &middot; NDSS, 2019 &middot; 15 pp"
pages = "15"
diff = "MODERATE"
blurb = "Large-scale crawl showing XSS moved client-side into browser storage while defenses stayed server-side."
background = "JavaScript and the same-origin policy from Week 9."
[[week.paper]]
role = "Recommended"
title = "Cookie Crumbles: Breaking and Fixing Web Session Integrity"
url = "https://www.usenix.org/system/files/usenixsecurity23-squarcina.pdf"
cite = "Squarcina, Ad&atilde;o, Veronese &amp; Maffei &middot; USENIX Security, 2023 &middot; 18 pp"
diff = "HARD"
blurb = "Cookies still have no integrity guarantee: Secure, prefixes and SameSite all bypassable, with 12 CVEs."
background = "Session fixation and CSRF. Also assumes subdomain structure."
[[week.paper]]
role = "Reference"
title = "A Classification of SQL-Injection Attacks and Countermeasures"
url = "https://viterbi-web.usc.edu/~halfond/papers/halfond06issse.pdf"
cite = "Halfond, Viegas &amp; Orso &middot; ISSSE, 2006 &middot; 13 pp"
diff = "EASY"
blurb = "Skim only, for the taxonomy. There is no strong recent SQL injection paper at a top venue, because parameterized queries essentially solved the class."
background = "Basic SQL. Nothing else."

[[week]]
n = 11
section = "Network Security"
date = "Tue 27-Oct"
date_long = "Tue 27 Oct"
topic = "Intro to Network, ARP, TCP"
glance_req = "Bellovin"
glance_pages = "17"
q = [
  "Bellovin described these attacks in 1989 and many persist. Which are fixed, which are not, and what distinguishes the two groups?",
  "He published attacks before they were exploited. Was that responsible in 1989? Would it be today?",
  "Cao et al. exploit a rate limiter added for robustness. Where else in this course has shared global state created a side channel?",
]
[[week.paper]]
role = "Required"
title = "Security Problems in the TCP/IP Protocol Suite"
short = "Bellovin, <em>Security Problems in the TCP/IP Protocol Suite</em>"
url = "https://zoo.cs.yale.edu/classes/cs257/materials/p32-bellovin.pdf"
cite = "Steven M. Bellovin &middot; ACM SIGCOMM CCR, 1989 &middot; 17 pp"
pages = "17"
diff = "EASY"
blurb = "The origin document for sequence-number prediction, spoofing and routing attacks &mdash; written before most were exploited."
background = "TCP/IP basics from this week's lecture."
[[week.paper]]
role = "Recommended"
title = "Off-Path TCP Exploits: Global Rate Limit Considered Dangerous"
url = "https://www.usenix.org/system/files/conference/usenixsecurity16/sec16_paper_cao.pdf"
cite = "Cao, Qian, Wang, Dao, Krishnamurthy &amp; Marvel &middot; USENIX Security, 2016 &middot; 17 pp"
diff = "MODERATE"
blurb = "A shared counter in Linux's TCP stack becomes a side channel enabling blind connection hijacking."
background = "TCP connection state and sequence numbers from this week."

[[week]]
n = 12
section = "Network Security"
date = "Tue 3-Nov"
date_long = "Tue 3 Nov"
topic = "Firewall, Intrusion Detection"
glance_req = "Ptacek &amp; Newsham, Sections 1&ndash;4"
glance_pages = "13"
q = [
  "The core insight is that monitor and endpoint disagree about semantics. Does pervasive encryption make this better or worse for a modern detector?",
  "Base-rate fallacy: at realistic attack rates, what false-positive rate does a detector need before its alerts are worth a human's attention?",
  "Arp et al. find pervasive methodological flaws in published work. If you were reviewing for a top venue, what three checks would you make mandatory?",
]
[[week.paper]]
role = "Required"
title = "Insertion, Evasion, and Denial of Service: Eluding Network Intrusion Detection"
